name: Backup production

on:
  workflow_dispatch:
    inputs:
      retention_class:
        description: Retention namespace for this manual backup
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
          - monthly

permissions:
  contents: read

concurrency:
  group: lejapon-production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted PostgreSQL and Storage backup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_CLI_VERSION: "2.117.0"
      RCLONE_RELEASE_VERSION: "1.75.1"
      BACKUP_RETENTION_CLASS: ${{ inputs.retention_class }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_BACKUP_S3_ENDPOINT: ${{ secrets.SUPABASE_BACKUP_S3_ENDPOINT }}
      SUPABASE_BACKUP_S3_REGION: ${{ secrets.SUPABASE_BACKUP_S3_REGION }}
      SUPABASE_BACKUP_S3_PROVIDER: ${{ vars.SUPABASE_BACKUP_S3_PROVIDER }}
      SUPABASE_BACKUP_S3_FORCE_PATH_STYLE: ${{ vars.SUPABASE_BACKUP_S3_FORCE_PATH_STYLE }}
      SUPABASE_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_BACKUP_S3_ACCESS_KEY_ID }}
      SUPABASE_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_PROVIDER: ${{ vars.BACKUP_S3_PROVIDER }}
      BACKUP_S3_FORCE_PATH_STYLE: ${{ vars.BACKUP_S3_FORCE_PATH_STYLE }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_CRYPT_PASSWORD: ${{ secrets.BACKUP_CRYPT_PASSWORD }}
      BACKUP_CRYPT_SALT: ${{ secrets.BACKUP_CRYPT_SALT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show source commit
        run: |
          printf 'Backup source commit: %s\n' "$GITHUB_SHA"

      - name: Validate required secret names
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          required=(
            SUPABASE_DB_URL
            SUPABASE_BACKUP_S3_ENDPOINT
            SUPABASE_BACKUP_S3_ACCESS_KEY_ID
            SUPABASE_BACKUP_S3_SECRET_ACCESS_KEY
            BACKUP_S3_ENDPOINT
            BACKUP_S3_REGION
            BACKUP_S3_BUCKET
            BACKUP_S3_ACCESS_KEY_ID
            BACKUP_S3_SECRET_ACCESS_KEY
            BACKUP_CRYPT_PASSWORD
            BACKUP_CRYPT_SALT
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              printf 'Required GitHub Secret is missing: %s\n' "$name" >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "${!name}"
          done

      - name: Install pinned rclone
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64.zip"
          base_url="https://downloads.rclone.org/v${RCLONE_RELEASE_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --remote-name "${base_url}/${archive}"
          curl --fail --silent --show-error --location --remote-name "${base_url}/SHA256SUMS"
          grep "  ${archive}$" SHA256SUMS | sha256sum --check --strict -
          unzip -q "$archive"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate pinned tools
        shell: bash
        run: |
          set -Eeuo pipefail
          rclone version | sed -n '1p'
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version

      - name: Run encrypted production backup
        id: backup
        shell: bash
        env:
          LEJAPON_BACKUP_WORK_ROOT: ${{ runner.temp }}/lejapon-backups
          LEJAPON_BACKUP_RESULT_FILE: ${{ runner.temp }}/lejapon-backup-result.env
        run: |
          set -Eeuo pipefail
          set +x
          ./scripts/backup-production-all.sh
          remote_path="$(awk -F= '$1 == "REMOTE_PATH" { print substr($0, index($0, "=") + 1) }' "$LEJAPON_BACKUP_RESULT_FILE")"
          backup_id="$(awk -F= '$1 == "BACKUP_ID" { print substr($0, index($0, "=") + 1) }' "$LEJAPON_BACKUP_RESULT_FILE")"
          [[ "$remote_path" =~ ^lejapon-prod/(daily|weekly|monthly)/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$backup_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          printf 'remote_path=%s\n' "$remote_path" >> "$GITHUB_OUTPUT"
          printf 'backup_id=%s\n' "$backup_id" >> "$GITHUB_OUTPUT"

      - name: Verify encrypted remote backup
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          ./scripts/verify-production-backup.sh --remote-path '${{ steps.backup.outputs.remote_path }}'

      - name: Report success
        run: |
          printf 'Encrypted production backup verified: %s\n' '${{ steps.backup.outputs.backup_id }}'

      - name: Clean temporary files
        if: always()
        shell: bash
        run: |
          set +e
          find "$RUNNER_TEMP/lejapon-backups" -maxdepth 5 -type f -name '*.log' -printf 'Diagnostic log retained during run: %f (%s bytes)\n' 2>/dev/null || true
          rm -rf -- "$RUNNER_TEMP/lejapon-backups" "$RUNNER_TEMP/lejapon-backup-result.env"
          rm -rf -- "$RUNNER_TEMP/rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64" "$RUNNER_TEMP/rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64.zip" "$RUNNER_TEMP/SHA256SUMS"
